name: Publicar NEXTZE no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Build de produção
        env:
          VITE_BASE_PATH: './'
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_SUPPORT_ENABLED: ${{ vars.VITE_SUPPORT_ENABLED || 'false' }}
          VITE_SUPPORT_ATTACHMENTS_ENABLED: 'false'
          VITE_SUPPORT_ENDPOINT: ${{ vars.VITE_SUPPORT_ENDPOINT || 'https://jqeonloeyvdapwmafnkm.supabase.co/functions/v1/support-intake' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || '0x4AAAAAAF-6t8AwQ6JRHbhU' }}
          VITE_SUPPORT_SYSTEMS: ${{ vars.VITE_SUPPORT_SYSTEMS }}
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
